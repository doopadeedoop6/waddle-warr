<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waddle War</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050d1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    /* ── Lobby overlay ───────────────────────────────────────────────────── */
    #lobby {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #030810 0%, #071428 50%, #040c20 100%);
      z-index: 100;
    }
    #snow-canvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 101;
    }
    #lobby-card {
      position: relative; z-index: 102;
      background: rgba(6,20,50,0.88);
      border: 1px solid rgba(74,240,255,0.22);
      border-radius: 18px;
      padding: 40px 48px;
      text-align: center;
      max-width: 460px;
      width: 92%;
      box-shadow: 0 0 60px rgba(74,240,255,0.06), 0 20px 60px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }

    /* ── Phase 1 ─────────────────────────────────────────────────────────── */
    #lobby-penguin {
      font-size: 3.8rem;
      display: inline-block;
      animation: pengBounce 1.6s ease-in-out infinite;
      line-height: 1;
      margin-bottom: 4px;
    }
    @keyframes pengBounce {
      0%,100% { transform: translateY(0) rotate(-5deg); }
      50%      { transform: translateY(-14px) rotate(5deg); }
    }
    #lobby-phase1 h1 {
      font-size: 3rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a8e6f0 0%, #4af0ff 40%, #ffffff 55%, #4af0ff 70%, #a8e6f0 100%);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite;
    }
    @keyframes shimmer { 0%,100% { background-position: 0% } 50% { background-position: 100% } }
    #lobby-phase1 .subtitle {
      color: #4a7a9a;
      font-size: 0.92rem;
      margin-bottom: 28px;
      letter-spacing: 0.06em;
    }
    #username-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid #2a5a8a;
      border-radius: 8px;
      color: #e0f4ff;
      outline: none;
      text-align: center;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }
    #username-input:focus { border-color: #4af0ff; }
    #username-error {
      color: #ff6666;
      font-size: 0.8rem;
      height: 18px;
      margin-bottom: 16px;
    }
    #join-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #1a6a9a, #0a4a7a);
      border: 1px solid #4af0ff55;
      border-radius: 8px;
      color: #a8e6f0;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    #join-btn:hover {
      background: linear-gradient(135deg, #2a8aca, #1a6aaa);
      box-shadow: 0 0 20px #4af0ff44;
    }

    /* ── Phase 2 ─────────────────────────────────────────────────────────── */
    #lobby-phase2 { display: none; }

    .p2-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .p2-header h1 {
      font-size: 2.4rem;
      letter-spacing: 0.15em;
      color: #a8e6f0;
      text-transform: uppercase;
      text-shadow: 0 0 16px #4af0ff88;
    }
    .mode-badge {
      background: linear-gradient(135deg, #0a4a7a, #0d5e9a);
      border: 1px solid #4af0ff66;
      border-radius: 5px;
      color: #4af0ff;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.14em;
      padding: 4px 9px;
      text-transform: uppercase;
      flex-shrink: 0;
      /* forward-compat slot for TDM badge swap */
    }

    /* Room code */
    .room-code-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      margin: 14px 0 20px;
    }
    .room-code-label {
      color: #4a7a9a;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #room-code {
      font-family: 'Courier New', monospace;
      font-size: 1.55rem;
      font-weight: bold;
      letter-spacing: 0.22em;
      color: #a8e6f0;
      text-shadow: 0 0 10px #4af0ff66;
      cursor: pointer;
      user-select: all;
      title: "Click to copy";
    }
    #room-code:hover { color: #4af0ff; }
    #room-code-copied {
      font-size: 0.7rem;
      color: #44ff88;
      letter-spacing: 0.08em;
      height: 14px;
      margin-bottom: 4px;
    }

    /* Map buttons */
    .map-section-label {
      color: #4a7a9a;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .map-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .map-btn {
      flex: 1;
      padding: 10px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: rgba(255,255,255,0.05);
      border: 1px solid #2a5a8a;
      border-radius: 8px;
      color: #7aaecc;
      cursor: pointer;
      transition: all 0.18s;
      text-transform: uppercase;
    }
    .map-btn:hover {
      background: rgba(74,240,255,0.08);
      border-color: #4af0ff66;
      color: #a8e6f0;
    }
    .map-btn.active {
      background: linear-gradient(135deg, #0a4a7a, #0d5e9a);
      border-color: #4af0ff;
      color: #4af0ff;
      box-shadow: 0 0 12px #4af0ff33;
    }

    /* Duration buttons — same visual style as map buttons */
    .duration-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .duration-btn {
      flex: 1;
      padding: 9px 6px;
      font-size: 0.83rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: rgba(255,255,255,0.05);
      border: 1px solid #2a5a8a;
      border-radius: 8px;
      color: #7aaecc;
      cursor: pointer;
      transition: all 0.18s;
      text-transform: uppercase;
    }
    .duration-btn:hover {
      background: rgba(74,240,255,0.08);
      border-color: #4af0ff66;
      color: #a8e6f0;
    }
    .duration-btn.active {
      background: linear-gradient(135deg, #0a4a7a, #0d5e9a);
      border-color: #4af0ff;
      color: #4af0ff;
      box-shadow: 0 0 12px #4af0ff33;
    }

    /* Bot count row */
    .bot-row {
      margin-bottom: 20px;
    }
    .bot-count-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .bot-count-header label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #4a7a9a;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .bot-count-header input[type="checkbox"] {
      accent-color: #4af0ff;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    #bot-count-label {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #a8e6f0;
    }
    #bot-count-slider {
      width: 100%;
      accent-color: #4af0ff;
      cursor: pointer;
    }

    /* Player list */
    .player-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .player-list-header span:first-child {
      color: #4a7a9a;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #player-count {
      color: #a8e6f0;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }
    #player-list {
      max-height: 168px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #1a4a8a transparent;
      background: rgba(0,0,0,0.18);
      border: 1px solid #1a3a6a;
      border-radius: 8px;
      padding: 6px 4px;
      margin-bottom: 18px;
    }
    #player-list::-webkit-scrollbar { width: 4px; }
    #player-list::-webkit-scrollbar-thumb { background: #1a4a8a; border-radius: 2px; }
    .player-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 8px;
      border-radius: 5px;
    }
    .player-item:hover { background: rgba(255,255,255,0.04); }
    .player-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 5px currentColor;
    }
    .player-name {
      font-size: 0.88rem;
      color: #c0dff0;
      letter-spacing: 0.04em;
    }
    .player-list-empty {
      color: #3a6a8a;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      padding: 12px 0;
    }

    /* Waiting / solo */
    .lobby-waiting {
      color: #3a6a8a;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      min-height: 18px;
    }
    #start-btn {
      display: none;
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, #0e6e2e, #0a5224);
      border: 1px solid #44ff8866;
      border-radius: 8px;
      color: #88ffbb;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    #start-btn:hover {
      background: linear-gradient(135deg, #14a040, #0d7035);
      box-shadow: 0 0 20px #44ff8833;
      color: #ccffdd;
    }
    #solo-btn {
      display: none;
      width: 100%;
      padding: 11px;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      background: rgba(255,255,255,0.05);
      border: 1px solid #4a7aaa55;
      border-radius: 8px;
      color: #7aaecc;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    #solo-btn:hover {
      background: rgba(74,240,255,0.07);
      border-color: #4af0ff55;
      color: #a8e6f0;
    }

    /* ── HUD shell — contents injected by HUD.js ──────────────────────────── */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      display: none;
    }
  </style>
  
  
  <!-- Vibe Jam 2026 — REQUIRED -->
  <script async src="https://vibej.am/2026/widget.js"></script>


</head>
<body>

  <!-- Snowfall background -->
  <canvas id="snow-canvas"></canvas>

  <!-- Lobby -->
  <div id="lobby">
    <div id="lobby-card">

      <!-- Phase 1: username entry -->
      <div id="lobby-phase1">
        <div id="lobby-penguin">🐧</div>
        <h1>Waddle War</h1>
        <p class="subtitle">Penguin · throw snow · survive</p>
        <input id="username-input" type="text" maxlength="16"
               placeholder="Enter username..." autocomplete="off" />
        <div id="username-error"></div>
        <button id="join-btn">ENTER THE ICE</button>
      </div>

      <!-- Phase 2: waiting room -->
      <div id="lobby-phase2">

        <div class="p2-header">
          <h1>Waddle War</h1>
          <span class="mode-badge" data-mode="FFA">FFA</span>
        </div>

        <div class="room-code-row">
          <span class="room-code-label">Room</span>
          <span id="room-code" title="Click to copy">------</span>
        </div>
        <div id="room-code-copied"></div>

        <p class="map-section-label">Map</p>
        <div class="map-btns">
          <button class="map-btn" data-map="ice_planet">🧊 Ice Planet</button>
          <button class="map-btn" data-map="glacier_canyon">Glacier Canyon <span style="font-size:0.62rem;background:#ff8c00;color:#fff;border-radius:3px;padding:1px 5px;vertical-align:middle;font-weight:700;letter-spacing:0.08em">BETA</span></button>
        </div>

        <p class="map-section-label">Match Duration</p>
        <div class="duration-btns">
          <button class="duration-btn" data-duration="5">5 min</button>
          <button class="duration-btn active" data-duration="10">10 min</button>
          <button class="duration-btn" data-duration="15">15 min</button>
          <button class="duration-btn" data-duration="20">20 min</button>
        </div>

        <div class="bot-row">
          <div class="bot-count-header">
            <label>
              <input type="checkbox" id="bots-enabled" checked />
              Bots
            </label>
            <span id="bot-count-label">15 bots</span>
          </div>
          <input type="range" id="bot-count-slider" min="0" max="15" value="15" step="1" />
        </div>

        <div class="player-list-header">
          <span>Players</span>
          <span id="player-count">0 / 16</span>
        </div>
        <div id="player-list">
          <div class="player-list-empty">Connecting...</div>
        </div>

        <p class="lobby-waiting" id="lobby-waiting-text">Waiting for players&hellip;</p>
        <button id="start-btn">START GAME</button>
        <button id="solo-btn">PLAY SOLO</button>

      </div>
    </div>
  </div>

  <!-- HUD — contents injected by HUD.js -->
  <div id="hud"></div>

  <script type="module" src="/main.js"></script>

  <script>
    // ── Lobby snowfall animation ───────────────────────────────────────────
    (function () {
      const canvas = document.getElementById('snow-canvas');
      const ctx    = canvas.getContext('2d');

      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);

      const flakes = Array.from({ length: 90 }, () => ({
        x:       Math.random() * window.innerWidth,
        y:       Math.random() * window.innerHeight,
        r:       0.8 + Math.random() * 2.8,
        speed:   0.4 + Math.random() * 1.2,
        drift:   (Math.random() - 0.5) * 0.25,
        opacity: 0.15 + Math.random() * 0.55,
        wobble:  Math.random() * Math.PI * 2,
        wobbleSpeed: 0.4 + Math.random() * 0.6,
      }));

      let last = 0;
      function tick(ts) {
        const dt = Math.min((ts - last) / 1000, 0.05);
        last = ts;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Subtle aurora glow bands at top
        const grd = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.35);
        grd.addColorStop(0,   'rgba(20,120,180,0.05)');
        grd.addColorStop(0.5, 'rgba(60,200,255,0.03)');
        grd.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const f of flakes) {
          f.wobble += f.wobbleSpeed * dt;
          f.x += f.drift + Math.sin(f.wobble) * 0.3;
          f.y += f.speed;
          if (f.y > canvas.height + 10) {
            f.y = -10;
            f.x = Math.random() * canvas.width;
          }
          if (f.x < -10) f.x = canvas.width + 10;
          if (f.x > canvas.width + 10) f.x = -10;

          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(190,230,255,${f.opacity})`;
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();

    // Click-to-copy room code
    document.getElementById('room-code').addEventListener('click', function() {
      const code = this.textContent;
      if (code === '------') return;
      navigator.clipboard?.writeText(code).then(() => {
        const el = document.getElementById('room-code-copied');
        el.textContent = 'Copied!';
        setTimeout(() => { el.textContent = ''; }, 1500);
      });
    });
  </script>
</body>
</html>
